{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'home' -%}
  <path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>
{%- elif name == 'zap' -%}
  <path d="M13 2L4 14h7l-1 8 9-12h-7z"/>
{%- elif name == 'plus' -%}
  <rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>
{%- elif name == 'join' -%}
  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>
{%- elif name == 'trophy' -%}
  <path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>
{%- elif name == 'user' -%}
  <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == 'history' -%}
  <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>
{%- elif name == 'menu' -%}
  <path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'star' -%}
  <path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>
{%- elif name == 'grid' -%}
  <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == 'percent' -%}
  <path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>
{%- elif name == 'lock' -%}
  <rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == 'swords' -%}
  <path d="M5 4l9 9"/><path d="M4 8l3 3"/><path d="M19 4l-9 9"/><path d="M20 8l-3 3"/><path d="M8 16l-3 3M16 16l3 3"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro logo_mark(size=38) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="logoGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cf75"/>
      <stop offset="1" stop-color="#c79a2b"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="11" fill="url(#logoGold)"/>
  <path d="M10 27L8.5 15 15 20 20 12 25 20 31.5 15 30 27Z" fill="#1a1405"/>
  <rect x="10" y="29.5" width="20" height="2.6" rx="1.3" fill="#1a1405"/>
</svg>
{%- endmacro %}
